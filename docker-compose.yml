services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: zory_pipeline
      POSTGRES_USER: zory
      POSTGRES_PASSWORD: zory2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zory -d zory_pipeline"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
